[project]
name = "agentkit"
version = "0.1.0"
description = "Hello Agent System：企业级 Agent 系统设计训练营——从零手写一个看得懂的教学框架，再用异步运行时与成熟组件（Postgres、Redis、Temporal、OpenTelemetry、LiteLLM、Cedar）落地生产"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# 第 20 课：同一任务的 DSPy / LangGraph / OpenAI Agents SDK 实现（版本已实测；0.x 的包锁小版本）
frameworks = [
    "dspy>=3.4,<3.5",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.6,<2",
    "openai-agents>=0.22,<0.23",
]
# 第 19 课：官方 MCP SDK 对照（可选，手写协议不依赖它）
mcp = ["mcp>=2.2"]
# 第四部分（第 26–30 课）：agentkit.contrib 的生产组件适配器
postgres = ["psycopg[binary,pool]>=3.2"]
redis = ["redis>=5"]
temporal = ["temporalio>=1.9"]
otel = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27", "prometheus-client>=0.21"]
policy = ["cedarpy>=4"]
gateway = ["litellm>=1.50"]
prod = ["agentkit[postgres,redis,temporal,otel,policy,gateway,server]"]
# 本机无 Docker 时的嵌入式基础设施（嵌入式 Postgres、fakeredis TCP 服务），测试与 demo 用
prod-local = ["pgserver>=0.1.4", "fakeredis[lua]>=2.26", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentkit", "agentkit.aio", "agentkit.contrib"]

[tool.pytest.ini_options]
# importlib 模式：允许多个课程目录里都有同名的 test_exercise.py
addopts = "--import-mode=importlib -q"
testpaths = ["tests", "lessons", "capstone", "production"]
