# 示例 Secret：只有占位符。真实值请用 External Secrets / Sealed Secrets / 云厂商的密钥管理服务注入，
# 不要把填好的版本提交到 git（第 09 课、第 12 课）。
apiVersion: v1
kind: Secret
metadata:
  name: itdesk-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://itdesk:REPLACE_ME@postgres.example.internal:5432/itdesk?sslmode=require
  REDIS_URL: rediss://:REPLACE_ME@redis.example.internal:6379/0
  LLM_API_KEY: REPLACE_ME_WITH_GATEWAY_VIRTUAL_KEY
  # 生产里身份由网关验证 JWT 后注入；这里只在没有网关的环境里用（值是 sha256(key) → 身份）
  API_KEYS_JSON: "{}"
